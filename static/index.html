<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Agent Tool Runtime</title>
    <style>
        :root{--bg:#0b1020;--surface:#11182b;--surface2:#182238;--line:#28344d;--text:#e7edf7;--muted:#91a0b8;--accent:#6d5dfc;--danger:#ef6a74;--ok:#4ade80}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}.app{display:flex;height:100vh}.sidebar{width:280px;background:var(--surface);border-right:1px solid var(--line);padding:14px;overflow:auto;transition:transform .2s}.brand{font-weight:700;font-size:17px;margin:4px 0 16px}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.mobile-menu{display:none}.btn{border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:8px;padding:8px 11px;cursor:pointer}.btn:hover{border-color:#7180a0}.primary{background:var(--accent);border-color:var(--accent)}.danger{color:#fecaca}.conversation{display:block;width:100%;margin:6px 0;padding:10px;border:0;border-radius:7px;text-align:left;background:transparent;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.conversation.active,.conversation:hover{background:var(--surface2);color:var(--text)}.main{display:flex;flex:1;min-width:0;flex-direction:column}.header{display:flex;min-height:64px;padding:12px 18px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--surface)}.title{font-weight:700}.subtitle,.muted{color:var(--muted);font-size:12px}.chat{flex:1;overflow:auto;padding:28px max(18px,calc((100% - 850px)/2))}.welcome{text-align:center;margin:15vh auto;color:var(--muted)}.message{max-width:80%;padding:12px 15px;border-radius:12px;margin:12px 0;line-height:1.55;white-space:pre-wrap}.message.user{margin-left:auto;background:var(--accent)}.message.assistant{background:var(--surface2);white-space:normal}.message.assistant pre{overflow:auto}.tools{margin-top:8px;color:#b8b2ff;font-size:11px}.inputbar{display:flex;gap:10px;padding:16px max(18px,calc((100% - 850px)/2));border-top:1px solid var(--line);background:var(--surface)}textarea{flex:1;resize:none;max-height:130px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:12px}.panel{position:fixed;z-index:20;right:0;top:0;bottom:0;width:min(520px,100vw);padding:16px;background:var(--surface);border-left:1px solid var(--line);overflow:auto;box-shadow:-10px 0 30px #0008}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.card{border:1px solid var(--line);border-radius:9px;padding:12px;margin:9px 0;background:var(--surface2)}.card-title{font-weight:650}.tag{font-size:11px;color:#c4b5fd}.form{display:grid;gap:10px}.form input,.form select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--text)}.auth-screen{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at top,#252052,var(--bg) 55%)}.auth-card{width:min(410px,calc(100% - 32px));padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:14px}.error{color:#fda4af;margin:8px 0}.success{color:var(--ok);white-space:pre-wrap}.modal{position:fixed;z-index:60;inset:0;display:grid;place-items:center;background:#000a}.modal-card{width:min(440px,calc(100% - 32px));padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:12px}.user-card select{width:100px}.status-ok{color:var(--ok)}.status-fail{color:var(--danger)}@media(max-width:720px){.sidebar{position:fixed;z-index:15;inset:0 auto 0 0;transform:translateX(-100%)}.sidebar.open{transform:none}.mobile-menu{display:inline-block}.message{max-width:94%}.header .optional{display:none}}
    </style>
</head>
<body>
<section class="auth-screen" id="authScreen">
    <form class="auth-card form" id="loginForm">
        <h1>Agent Tool Runtime</h1><div class="muted">Đăng nhập để tiếp tục</div>
        <input id="loginUsername" autocomplete="username" placeholder="Tên đăng nhập" required>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Mật khẩu" required>
        <div class="error" id="loginError"></div><button class="btn primary" type="submit">Đăng nhập</button>
    </form>
</section>

<div class="app hidden" id="application">
    <aside class="sidebar" id="sidebar">
        <div class="brand">Agent Tool Runtime</div>
        <button class="btn primary" style="width:100%" onclick="newChat()">＋ Cuộc trò chuyện mới</button>
        <div id="conversationList" style="margin-top:12px"></div>
        <button class="btn hidden" id="loadMore" onclick="loadConversations(false)">Tải thêm</button>
    </aside>
    <main class="main">
        <header class="header">
            <div class="row"><button class="btn mobile-menu" onclick="toggleSidebar()">☰</button><div><div class="title" id="chatTitle">AI Agent</div><div class="subtitle optional">Drive · RAG Memory · RBAC</div></div></div>
            <div class="row">
                <button class="btn" onclick="openDataPanel('memory')">Memory</button>
                <button class="btn optional" onclick="openDataPanel('documents')">Documents</button>
                <button class="btn optional" onclick="openDataPanel('audit')">Audit</button>
                <button class="btn hidden" id="adminButton" onclick="openAdmin()">Admin</button>
                <button class="btn" id="profileButton" onclick="openProfile()"></button>
                <button class="btn danger" onclick="logout()">Thoát</button>
            </div>
        </header>
        <div class="chat" id="chat"></div>
        <div class="inputbar"><textarea id="messageInput" rows="1" placeholder="Nhập tin nhắn…"></textarea><button class="btn primary" id="sendButton" onclick="sendMessage()">Gửi</button></div>
    </main>
</div>

<section class="panel hidden" id="dataPanel"><div class="panel-head"><h2 id="dataTitle"></h2><button class="btn" onclick="closePanel('dataPanel')">Đóng</button></div><div id="dataBody"></div></section>
<section class="panel hidden" id="adminPanel"><div class="panel-head"><h2>Quản trị tài khoản</h2><button class="btn" onclick="closePanel('adminPanel')">Đóng</button></div>
    <form class="form card" id="createUserForm"><input id="newUsername" placeholder="Username" required><input id="newDisplayName" placeholder="Tên hiển thị"><select id="newRole"><option value="user">user</option><option value="guest">guest</option><option value="admin">admin</option></select><button class="btn primary">Tạo tài khoản</button><div class="success" id="temporaryPassword"></div></form>
    <div id="userList"></div>
</section>
<section class="panel hidden" id="profilePanel"><div class="panel-head"><h2>Tài khoản</h2><button class="btn" onclick="closePanel('profilePanel')">Đóng</button></div><div id="profileInfo" class="card"></div><form class="form card" id="changePasswordForm"><h3>Đổi mật khẩu</h3><input id="currentPassword" type="password" placeholder="Mật khẩu hiện tại" required><input id="newPassword" type="password" minlength="12" maxlength="128" placeholder="Mật khẩu mới (ít nhất 12 ký tự)" required><button class="btn primary">Đổi mật khẩu</button><div class="error" id="passwordError"></div></form></section>
<section class="modal hidden" id="forcedChange"><form class="modal-card form" id="forcedChangeForm"><h2>Đổi mật khẩu tạm</h2><div class="muted">Bạn phải đặt mật khẩu mới trước khi sử dụng ứng dụng.</div><input id="forcedPassword" type="password" minlength="12" maxlength="128" placeholder="Mật khẩu mới" required><input id="forcedConfirmation" type="password" placeholder="Nhập lại mật khẩu" required><div class="error" id="forcedError"></div><button class="btn primary">Hoàn tất</button></form></section>

<script>
const API='';const ACTIVE_KEY='assignment-1-active-conversation-id';let accessToken=null,currentUser=null,refreshPromise=null,changeToken=null,activeConversationId=localStorage.getItem(ACTIVE_KEY),conversations=[],conversationCursor=null,loadedMessages=[],nextBefore=null;
const el=id=>document.getElementById(id);const hasPermission=value=>currentUser?.permissions?.includes(value);
async function rawJson(url,options={}){const response=await fetch(API+url,options);let data={};try{data=await response.json()}catch{}if(!response.ok)throw Object.assign(new Error(data.detail||`HTTP ${response.status}`),{status:response.status});return data}
async function refreshAccess(){if(!refreshPromise)refreshPromise=rawJson('/api/auth/refresh',{method:'POST',credentials:'same-origin'}).then(data=>{applySession(data);return true}).catch(()=>false).finally(()=>refreshPromise=null);return refreshPromise}
async function apiFetch(url,options={},retry=true){const headers=new Headers(options.headers||{});if(accessToken)headers.set('Authorization','Bearer '+accessToken);if(options.body&&!headers.has('Content-Type'))headers.set('Content-Type','application/json');try{return await rawJson(url,{...options,headers,credentials:'same-origin'})}catch(error){if(error.status===401&&retry&&await refreshAccess())return apiFetch(url,options,false);if(error.status===401)showLogin();throw error}}
function applySession(data){accessToken=data.access_token;currentUser=data.user;el('profileButton').textContent=currentUser.display_name||currentUser.username;el('adminButton').classList.toggle('hidden',!hasPermission('users:manage'));el('profileInfo').textContent=`${currentUser.username} · ${currentUser.role}`}
function showLogin(){accessToken=null;currentUser=null;el('application').classList.add('hidden');el('authScreen').classList.remove('hidden')}
async function startApp(){el('authScreen').classList.add('hidden');el('application').classList.remove('hidden');showWelcome();await Promise.all([loadConversations(),loadMemory()]);if(activeConversationId&&conversations.some(x=>x.id===activeConversationId))await selectConversation(activeConversationId);else if(conversations.length)await selectConversation(conversations[0].id);else newChat()}
el('loginForm').onsubmit=async event=>{event.preventDefault();el('loginError').textContent='';try{const data=await rawJson('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:el('loginUsername').value,password:el('loginPassword').value})});if(data.password_change_required){changeToken=data.change_token;el('forcedChange').classList.remove('hidden');return}applySession(data);await startApp()}catch(error){el('loginError').textContent=error.message}}
el('forcedChangeForm').onsubmit=async event=>{event.preventDefault();const password=el('forcedPassword').value;if(password!==el('forcedConfirmation').value){el('forcedError').textContent='Mật khẩu nhập lại không khớp';return}try{const data=await rawJson('/api/auth/complete-password-change',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({change_token:changeToken,new_password:password})});changeToken=null;el('forcedChange').classList.add('hidden');applySession(data);await startApp()}catch(error){el('forcedError').textContent=error.message}}
async function logout(){try{await rawJson('/api/auth/logout',{method:'POST',credentials:'same-origin'})}finally{localStorage.removeItem(ACTIVE_KEY);showLogin()}}
function closePanel(id){el(id).classList.add('hidden')}function showWelcome(){el('chat').innerHTML='<div class="welcome" id="welcome"><h2>Bắt đầu cuộc trò chuyện</h2><p>Hỏi về Drive hoặc sử dụng RAG memory của riêng bạn.</p></div>'}
function messageNode(text,role,tools=[],safeHtml=''){const node=document.createElement('div');node.className='message '+role;if(role==='assistant'&&safeHtml)node.innerHTML = safeHtml;else node.textContent = text;if(tools.length){const badge=document.createElement('div');badge.className='tools';badge.textContent='Tools: '+tools.join(', ');node.appendChild(badge)}return node}
function addMessage(...args){el('welcome')?.remove();el('chat').appendChild(messageNode(...args));el('chat').scrollTop=el('chat').scrollHeight}
function renderConversations(){el('conversationList').replaceChildren();for(const item of conversations){const button=document.createElement('button');button.className='conversation'+(item.id===activeConversationId?' active':'');button.textContent=item.title;button.onclick=()=>selectConversation(item.id);el('conversationList').appendChild(button)}el('loadMore').classList.toggle('hidden',!conversationCursor)}
async function loadConversations(reset=true){const url=new URL(API+'/api/conversations',location.origin);url.searchParams.set('limit','30');if(!reset&&conversationCursor)url.searchParams.set('cursor',conversationCursor);const data=await apiFetch(url.pathname+url.search);conversations=reset?data.conversations:conversations.concat(data.conversations);conversationCursor=data.next_cursor;renderConversations()}
function renderMessages(){el('chat').replaceChildren();if(nextBefore!==null){const older=document.createElement('button');older.className='btn';older.textContent='Tải tin nhắn cũ hơn';older.onclick=loadOlderMessages;el('chat').appendChild(older)}for(const message of loadedMessages)el('chat').appendChild(messageNode(message.content,message.role,message.tools_used||[],message.response_html||''));if(!loadedMessages.length)showWelcome()}
async function selectConversation(id){activeConversationId=id;localStorage.setItem(ACTIVE_KEY,id);renderConversations();const summary=conversations.find(x=>x.id===id);el('chatTitle').textContent=summary?.title||'Conversation';const data=await apiFetch(`/api/conversations/${encodeURIComponent(id)}/messages?limit=50`);loadedMessages=data.messages;nextBefore=data.next_before;renderMessages();el('chat').scrollTop=el('chat').scrollHeight;el('sidebar').classList.remove('open')}
async function loadOlderMessages(){if(!activeConversationId||nextBefore===null)return;const oldHeight=el('chat').scrollHeight;const data=await apiFetch(`/api/conversations/${encodeURIComponent(activeConversationId)}/messages?limit=50&before=${nextBefore}`);loadedMessages=data.messages.concat(loadedMessages);nextBefore=data.next_before;renderMessages();el('chat').scrollTop=el('chat').scrollHeight-oldHeight}
function toggleSidebar(){el('sidebar').classList.toggle('open')}
function newChat(){activeConversationId=null;localStorage.removeItem(ACTIVE_KEY);loadedMessages=[];nextBefore=null;el('chatTitle').textContent='AI Agent';renderConversations();showWelcome();el('messageInput').focus()}
async function sendMessage(){const input=el('messageInput'),button=el('sendButton'),message=input.value.trim();if(!message||button.disabled)return;addMessage(message,'user');input.value='';button.disabled=true;try{const data=await apiFetch('/api/chat',{method:'POST',body:JSON.stringify({conversation_id:activeConversationId,client_message_id:crypto.randomUUID(),message})});activeConversationId=data.conversation_id;localStorage.setItem(ACTIVE_KEY,activeConversationId);el('chatTitle').textContent=data.title;addMessage(data.response,'assistant',data.tools_used||[],data.response_html||'');await loadConversations()}catch(error){addMessage('Error: '+error.message,'assistant')}finally{button.disabled=false;input.focus()}}
el('messageInput').onkeydown=event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}}
async function openDataPanel(type){el('dataPanel').classList.remove('hidden');el('dataTitle').textContent={memory:'Memory',documents:'Documents',audit:'Audit log'}[type];el('dataBody').textContent='Đang tải…';try{let url=type==='memory'?'/api/memories':type==='documents'?'/api/documents':'/api/audit?session_id='+(activeConversationId||'default');const data=await apiFetch(url);const values=type==='memory'?data.facts:type==='documents'?data.documents:data.audit_log;el('dataBody').replaceChildren();for(const item of values){const card=document.createElement('div');card.className='card';const title=document.createElement('div');title.className='card-title';title.textContent=type==='memory'?item.text:type==='documents'?(item.file_name||'Saved document'):`${item.tool} [${item.status}]`;const meta=document.createElement('div');meta.className='tag';meta.textContent=type==='memory'?`${item.category} · ${item.topic||''}`:type==='documents'?`${item.category} · ${item.stored_chunks}/${item.chunk_count} chunks`:(item.timestamp||'');card.append(title,meta);el('dataBody').appendChild(card)}if(!values.length)el('dataBody').textContent='Chưa có dữ liệu.'}catch(error){el('dataBody').textContent=error.message}}
async function loadMemory(ignore=true){if(!hasPermission('memory:read'))return;try{await apiFetch('/api/memories')}catch(error){if(!ignore)throw error}}
function openProfile(){el('profilePanel').classList.remove('hidden')}
el('changePasswordForm').onsubmit=async event=>{event.preventDefault();try{const data=await apiFetch('/api/auth/change-password',{method:'POST',body:JSON.stringify({current_password:el('currentPassword').value,new_password:el('newPassword').value})});applySession(data);el('currentPassword').value='';el('newPassword').value='';el('passwordError').textContent='Đổi mật khẩu thành công'}catch(error){el('passwordError').textContent=error.message}}
async function openAdmin(){el('adminPanel').classList.remove('hidden');await loadUsers()}
async function loadUsers(){const data=await apiFetch('/api/admin/users?limit=100');const root=el('userList');root.replaceChildren();for(const user of data.users){const card=document.createElement('div');card.className='card user-card';const top=document.createElement('div');top.className='row';const name=document.createElement('div');name.className='grow card-title';name.textContent=`${user.display_name||user.username} (${user.username})`;const role=document.createElement('select');for(const value of ['admin','user','guest']){const option=document.createElement('option');option.value=value;option.textContent=value;option.selected=value===user.role;role.appendChild(option)}const toggle=document.createElement('button');toggle.className='btn';toggle.textContent=user.is_active?'Khóa':'Mở khóa';toggle.onclick=()=>updateUser(user.user_id,{is_active:!user.is_active});const save=document.createElement('button');save.className='btn';save.textContent='Lưu role';save.onclick=()=>updateUser(user.user_id,{role:role.value});const reset=document.createElement('button');reset.className='btn danger';reset.textContent='Reset mật khẩu';reset.disabled=user.user_id===currentUser.user_id;reset.onclick=()=>resetPassword(user.user_id);top.append(name,role,save,toggle,reset);card.appendChild(top);root.appendChild(card)}}
async function updateUser(id,changes){try{await apiFetch('/api/admin/users/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(changes)});await loadUsers()}catch(error){alert(error.message)}}
async function resetPassword(id){if(!confirm('Reset mật khẩu tài khoản này?'))return;try{const data=await apiFetch(`/api/admin/users/${encodeURIComponent(id)}/reset-password`,{method:'POST'});alert('Mật khẩu tạm (chỉ hiển thị lần này):\n'+data.temporary_password);await loadUsers()}catch(error){alert(error.message)}}
el('createUserForm').onsubmit=async event=>{event.preventDefault();try{const data=await apiFetch('/api/admin/users',{method:'POST',body:JSON.stringify({username:el('newUsername').value,display_name:el('newDisplayName').value,role:el('newRole').value})});el('temporaryPassword').textContent='Mật khẩu tạm (chỉ hiển thị lần này):\n'+data.temporary_password;el('newUsername').value='';el('newDisplayName').value='';await loadUsers()}catch(error){el('temporaryPassword').textContent=error.message}}
(async()=>{if(await refreshAccess())await startApp();else showLogin()})();
</script>
</body>
</html>
